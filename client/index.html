<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dealwise — quote to cash, on autopilot</title>
    <meta name="description" content="Dealwise is B2B sales operations software: quotes, discount approvals, inventory, billing and a customer portal in one place." />
    <!-- apply the saved theme before first paint so dark mode never flashes light; default is light -->
    <script>
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
